services:
  tapo-bridge:
    build: .
    image: tapo-bridge:latest
    container_name: tapo-bridge
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8189:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
